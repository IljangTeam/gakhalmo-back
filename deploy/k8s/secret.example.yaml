# gakhalmo-back — K8s env 공급 템플릿.
#
# 이 파일은 "공급 경로 문서" 역할을 한다. 실제 값은 절대 커밋하지 않는다.
#
# 운영 전제:
#   - GitOps 저장소 (apps/gakhalmo-back/overlays/{dev,prod}/)가 진짜 Secret/
#     ConfigMap 매니페스트를 관리한다 — sealed-secrets 또는 External Secrets
#     Operator로 암호화된 상태로만 존재해야 한다.
#   - 이 앱 저장소에는 참조용 스키마만 둔다.
#
# ─── Secret: 필수 시크릿 (default 없음) ────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: gakhalmo-back-secrets
  namespace: gakhalmo
type: Opaque
stringData:
  # Postgres URL — 호스트는 K8s DNS (e.g. postgres.db.svc.cluster.local).
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/gakhalmo"
  # ≥32 bytes. 환경별로 다른 값.
  JWT_SECRET: "REPLACE-WITH-48-BYTE-RANDOM-TOKEN"
  # Google Cloud Console에서 발급.
  GOOGLE_CLIENT_ID: "REPLACE"
  GOOGLE_CLIENT_SECRET: "REPLACE"
---
# ─── ConfigMap: 비시크릿 환경 설정 ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: gakhalmo-back-config
  namespace: gakhalmo
data:
  ENV: "prod"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  DATABASE_ECHO: "false"
  CORS_ORIGINS: "https://gakhalmo.kr"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "14"
  BCRYPT_ROUNDS: "12"
  GOOGLE_REDIRECT_URI: "https://api.gakhalmo.kr/api/v1/auth/google/callback"
  OAUTH_STATE_TTL_SECONDS: "600"
  AUTH_ALLOW_GOOGLE_AUTOLINK: "false"
  RUN_STARTUP_SEED: "false"
---
# ─── Deployment 에서 envFrom으로 주입 (발췌) ───────────────────────────
#
# spec:
#   template:
#     spec:
#       containers:
#         - name: gakhalmo-back
#           envFrom:
#             - secretRef:
#                 name: gakhalmo-back-secrets
#             - configMapRef:
#                 name: gakhalmo-back-config
