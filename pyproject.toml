[project]
name = "gakhalmo-back"
version = "0.1.0"
description = "각자 모여서 할거 하는 모임"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.13.0",
    "asyncmy>=0.2.10",
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "fastapi>=0.135.2",
    "greenlet>=3.1.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-ulid>=3.0.0",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
